name: Create Release PR
on:
  workflow_dispatch:
    inputs:
      new_version:
        description: "New SDK version (X.Y.Z)"
        required: true
        type: string
permissions:
  contents: read

jobs:
  Release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.ref }}
    - name: validate package dependencies
      run: |
        RESULT=$(swift package show-dependencies | grep unspecified) || true
        if [ -n "$RESULT" ]; then
          echo "Unspecified dependencies found in the package:"
          echo "$RESULT"
          exit 1
        else
          echo "All dependencies are specified correctly."
        fi
    - name: update version
      env:
        NEW_VERSION: ${{ inputs.new_version }}
      run: |
        if [[ ! ${NEW_VERSION} =~ ^[[:digit:]]+\.[[:digit:]]+\.[[:digit:]]+$ ]]; then
          echo "Invalid version format. Expected format: X.Y.Z"
          exit 1
        fi
        sed -e 's/<NEW_VERSION>/'"${NEW_VERSION}"'/' .github/workflows/Version.template > Sources/apm-agent-ios/Version.swift
    - uses: actions/create-github-app-token@v3
      id: app-token
      with:
        app-id: ${{ secrets.OBS_AUTOMATION_APP_ID }}
        private-key: ${{ secrets.OBS_AUTOMATION_APP_PEM }}
    - name: Setup github CLI
      uses: elastic/oblt-actions/git/setup@v1
      with:
        github-token: ${{ steps.app-token.outputs.token }}
    - name: Create pull request
      env:
        NEW_VERSION: ${{ inputs.new_version }}
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        if [[ ! ${NEW_VERSION} =~ ^[[:digit:]]+\.[[:digit:]]+\.[[:digit:]]+$ ]]; then
          echo "Invalid version format. Expected format: X.Y.Z"
          exit 1
        fi
        git checkout -b "rel/${NEW_VERSION}"
        git add Sources/apm-agent-ios/Version.swift
        git commit -m "Release ${NEW_VERSION}"
        git push origin "rel/${NEW_VERSION}"
        gh pr create \
          --title "Release ${NEW_VERSION}" \
          --body "This PR updates the SDK version. Merging it creates the ${NEW_VERSION} tag and publishes ${NEW_VERSION} as the latest stable GitHub release." \
          --base main \
          --head "rel/${NEW_VERSION}"
