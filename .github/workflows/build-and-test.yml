name: Build and Test

env:
  ELASTIC_VERSION: 9.4.2

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-slim
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - id: filter
        name: Detect non-Markdown changes
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          else
            base_sha="$PUSH_BASE_SHA"
            head_sha="$PUSH_HEAD_SHA"
          fi

          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]] || \
             ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            echo "Unable to compare with the previous revision; running code checks."
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$base_sha" "$head_sha" -- . ':(exclude,glob)**/*.md'; then
            echo "Only Markdown files changed; skipping code checks."
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "Non-Markdown files changed; running code checks."
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  swift-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: swift-lint (changed files in PR)
        uses: norio-nomura/action-swiftlint@9f4dcd7fd46b4e75d7935cf2f4df406d5cae3684 # 3.2.1
        env:
          args: --strict
          # base_ref is set for pull_request; on push, diff against the default branch.
          DIFF_BASE: ${{ github.base_ref || github.event.repository.default_branch }}

  api-stability:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Resolve latest release
        id: baseline
        shell: bash
        run: |
          baseline="$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)"
          if [[ -z "$baseline" ]]; then
            echo "::error::No plain-semver release tag is available for the API stability baseline."
            exit 1
          fi
          echo "tag=$baseline" >> "$GITHUB_OUTPUT"
      # The macOS host compares only API that is buildable on macOS. API inside
      # iOS-only conditional blocks is outside this gate.
      - name: Diagnose API breaking changes
        env:
          BASELINE_TAG: ${{ steps.baseline.outputs.tag }}
        shell: bash
        run: |
          allowlist_args=()
          if [[ -f .ci/api-breakage-allowlist.txt ]]; then
            allowlist_args+=(--breakage-allowlist-path .ci/api-breakage-allowlist.txt)
          fi
          swift package diagnose-api-breaking-changes \
            "$BASELINE_TAG" \
            "${allowlist_args[@]}"

  xcode-matrix:
    name: xcode (${{ matrix.label }})
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: swiftpm
            runner: macos-latest
            setup-brew: false
          - label: ios
            runner: macos-latest-large
            setup-brew: true
          - label: tvos
            runner: macos-latest-large
            setup-brew: true
          - label: watchos
            runner: macos-latest-large
            setup-brew: true
          - label: iphoneos-build
            runner: macos-latest
            setup-brew: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - name: Install Homebrew tools
        if: ${{ matrix.setup-brew }}
        run: make setup-brew
      - name: SwiftPM tests (macOS)
        if: ${{ matrix.label == 'swiftpm' }}
        run: swift test
      - name: Build and test (iOS Simulator)
        if: ${{ matrix.label == 'ios' }}
        env:
          IOS_RESULT_BUNDLE_PATH: ${{ runner.temp }}/ios-tests.xcresult
        run: |
          make build-for-testing-ios
          make test-without-building-ios
      - name: Extract failed iOS test diagnostics
        if: ${{ failure() && matrix.label == 'ios' }}
        env:
          IOS_RESULT_BUNDLE_PATH: ${{ runner.temp }}/ios-tests.xcresult
          IOS_RESULT_DIAGNOSTICS_PATH: ${{ runner.temp }}/ios-test-diagnostics
        run: |
          if [[ ! -d "$IOS_RESULT_BUNDLE_PATH" ]]; then
            echo "::warning::No iOS test result bundle was created"
            exit 0
          fi

          mkdir -p "$IOS_RESULT_DIAGNOSTICS_PATH"
          xcrun xcresulttool get test-results summary \
            --path "$IOS_RESULT_BUNDLE_PATH" > "$IOS_RESULT_DIAGNOSTICS_PATH/summary.json"
          xcrun xcresulttool get log --type action \
            --path "$IOS_RESULT_BUNDLE_PATH" > "$IOS_RESULT_DIAGNOSTICS_PATH/action-log.json"
      - name: Upload failed iOS test diagnostics
        if: ${{ failure() && matrix.label == 'ios' }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-diagnostics
          path: ${{ runner.temp }}/ios-test-diagnostics
          if-no-files-found: warn
          retention-days: 7
      - name: Build and test (tvOS Simulator)
        if: ${{ matrix.label == 'tvos' }}
        run: |
          make build-for-testing-tvos
          make test-without-building-tvos
      - name: Build and test (watchOS Simulator)
        if: ${{ matrix.label == 'watchos' }}
        run: |
          make build-for-testing-watchos
          make test-without-building-watchos
      - name: Device build (iOS / ElasticApm scheme)
        if: ${{ matrix.label == 'iphoneos-build' }}
        run: .ci/scripts/build.sh

  e2e:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: macos-latest-large
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - name: Cache Elastic distributions
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-cache
          key: elastic-e2e-${{ env.ELASTIC_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Run end-to-end telemetry test
        run: .github/scripts/e2e-test/e2e_test.sh
      - name: Store end-to-end diagnostics
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-results
          path: build/e2e/*
          if-no-files-found: error

  required-status-checks:
    needs:
      - changes
      - swift-lint
      - api-stability
      - xcode-matrix
      - e2e
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check required jobs
        id: check
        uses: elastic/oblt-actions/check-dependent-jobs@v1
        with:
          jobs: ${{ toJSON(needs) }}
          skipped-as-success: true
      - run: ${{ steps.check.outputs.is-success }}

  package:
    needs: [changes, required-status-checks]
    if: ${{ needs.changes.outputs.code == 'true' && needs.required-status-checks.result == 'success' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - name: Package workspace snapshot
        run: .ci/scripts/package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            dist/**
