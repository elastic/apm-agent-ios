name: Tag & Note Release
on:
  pull_request:
    branches:
      - main
    types:
      - closed
permissions:
  contents: read

jobs:
  CheckRelease:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.head_ref, 'rel/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate release branch
        id: check-release
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "${GITHUB_HEAD_REF}" =~ ^rel/([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Release branches must use the format rel/X.Y.Z"
            exit 1
          fi
      - uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ steps.check-release.outputs.version }}
          commit: ${{ github.event.pull_request.merge_commit_sha }}
          name: ${{ steps.check-release.outputs.version }}
          draft: false
          prerelease: false
          makeLatest: true
          generateReleaseNotes: true
