---
name: Prepare release

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Release-note JSON. Use the draft workflow.
        required: true
        type: string

permissions:
  contents: read

# One preparation at a time, so two dispatches cannot both pass the
# release-in-flight check before either has pushed its branches.
concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Get automation token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.OBS_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.OBS_AUTOMATION_APP_PEM }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}

      - uses: elastic/oblt-actions/git/setup@v1
        with:
          github-token: ${{ steps.token.outputs.token }}

      - name: Prepare release changes
        id: prepare
        uses: elastic/oblt-actions/edot-release/prepare-start@v1
        with:
          notes: ${{ inputs.release_notes }}
          github-token: ${{ steps.token.outputs.token }}

      - name: Check package dependencies
        if: steps.prepare.outputs.prepared == 'true'
        run: |
          dependencies=$(swift package show-dependencies)
          unspecified=$(printf '%s\n' "$dependencies" | grep 'unspecified' || true)
          if [[ -n $unspecified ]]; then
            echo "Package dependencies must resolve to a version. Unspecified dependencies:" >&2
            printf '%s\n' "$unspecified" >&2
            exit 1
          fi

      - name: Update the SwiftPM package version
        if: steps.prepare.outputs.prepared == 'true'
        env:
          RELEASE_VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          file=docs/reference/edot-ios/getting-started.md
          pattern='from: "[0-9]+\.[0-9]+\.[0-9]+"'
          count=$(grep -Ec "$pattern" "$file" || true)
          if [[ $count -ne 1 ]]; then
            echo "Expected exactly one SwiftPM from: version line in $file; found $count." >&2
            exit 1
          fi
          perl -pi -e 's/from: "[0-9]+\.[0-9]+\.[0-9]+"/from: "$ENV{RELEASE_VERSION}"/' "$file"

      - name: Open preparation pull request
        if: steps.prepare.outputs.prepared == 'true'
        uses: elastic/oblt-actions/edot-release/prepare-finish@v1
        with:
          release: ${{ steps.prepare.outputs.release }}
          github-token: ${{ steps.token.outputs.token }}
